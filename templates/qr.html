<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay ₹{{ amount }} — FamPay AutoQR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a12;color:#e8e8f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 30% 20%, rgba(0,224,164,.12), transparent 40%),
             radial-gradient(circle at 70% 80%, rgba(0,148,255,.12), transparent 40%),#0a0a12}
.card{width:100%;max-width:420px;background:#13131f;border:1px solid #252538;border-radius:24px;
  padding:32px 26px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.brand{font-size:14px;color:#8a8aa8;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase}
h1{font-size:44px;font-weight:800;margin:8px 0;
  background:linear-gradient(90deg,#00e0a4,#0094ff);-webkit-background-clip:text;color:transparent;background-clip:text}
.qr-wrap{background:#fff;border-radius:18px;padding:14px;display:inline-block;margin:16px 0;
  box-shadow:0 0 40px rgba(0,224,164,.2);position:relative}
.qr-wrap img{display:block;width:240px;height:240px}
.qr-wrap.verified::after{content:'✅';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:120px;background:rgba(0,224,164,.85);border-radius:18px;animation:pop .3s}
.upi-logos{display:flex;justify-content:center;gap:8px;margin:16px 0;flex-wrap:wrap}
.upi-logos span{background:#fff;color:#000;padding:6px 12px;border-radius:8px;font-weight:700;font-size:12px}
.timer{font-size:28px;font-weight:700;color:#ffa502;margin:12px 0;letter-spacing:1px;font-variant-numeric:tabular-nums}
.status{padding:12px;border-radius:10px;font-weight:600;font-size:14px;margin-top:8px}
.status.pending{background:rgba(255,165,2,.12);color:#ffa502}
.status.paid{background:rgba(0,224,164,.15);color:#00e0a4}
.status.expired{background:rgba(255,71,87,.15);color:#ff4757}
.upi-info{font-size:12px;color:#8a8aa8;margin-top:10px}
.upi-info b{color:#e8e8f5}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Pay via UPI</div>
  <h1>₹{{ "%.2f"|format(amount) }}</h1>
  <div class="upi-info">to <b>{{ full_name }}</b> · {{ upi_id }}</div>

  <div class="qr-wrap" id="qrWrap">
    <img src="{{ qr_b64 }}" alt="UPI QR Code">
  </div>

  <div class="upi-logos">
    <span>GPay</span><span>PhonePe</span><span>Paytm</span><span>UPI</span>
  </div>

  <div class="timer" id="timer">15:00</div>
  <div class="status pending" id="status">⏳ Waiting for payment...</div>
</div>

<script>
const orderId = "{{ order_id }}";
let secs = 900, timerInt, pollInt;
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');

function tick() {
  secs--;
  if (secs <= 0) {
    timerEl.textContent = '00:00'; timerEl.style.color = '#ff4757';
    statusEl.textContent = '❌ QR Expired'; statusEl.className = 'status expired';
    clearInterval(timerInt); clearInterval(pollInt);
    return;
  }
  const m = String(Math.floor(secs / 60)).padStart(2, '0');
  const s = String(secs % 60).padStart(2, '0');
  timerEl.textContent = m + ':' + s;
  if (secs <= 60) timerEl.style.color = '#ff4757';
}
async function poll() {
  try {
    const r = await fetch('/api/check-payment/' + orderId);
    const d = await r.json();
    if (d.status === 'PAID') {
      statusEl.textContent = '✅ Payment Verified! Txn: ' + (d.txn?.txn_id || '');
      statusEl.className = 'status paid';
      document.getElementById('qrWrap').classList.add('verified');
      timerEl.textContent = 'PAID'; timerEl.style.color = '#00e0a4';
      clearInterval(timerInt); clearInterval(pollInt);
    } else if (d.status === 'EXPIRED') {
      statusEl.textContent = '❌ QR Expired'; statusEl.className = 'status expired';
      clearInterval(timerInt); clearInterval(pollInt);
    }
  } catch {}
}
timerInt = setInterval(tick, 1000);
pollInt = setInterval(poll, 5000);
poll();
</script>
</body>
</html>
