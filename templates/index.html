<script>
/* ---------- utils ---------- */
function toast(m, err){const t=document.getElementById('toast');t.textContent=m;
  t.className='show'+(err?' err':'');clearTimeout(window.__t);
  window.__t=setTimeout(()=>t.className='',3000);}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('✅ Copied'))}
async function api(p, o={}){
  const r=await fetch(p,{headers:{'Content-Type':'application/json'},credentials:'same-origin',...o});
  let d={}; try{d=await r.json()}catch{}
  if(!r.ok) throw new Error(d.error||d.message||'Failed');
  return d;
}

/* ---------- auth ---------- */
function toggleAuth(m){
  document.getElementById('loginForm').classList.toggle('hidden',m!=='login');
  document.getElementById('regForm').classList.toggle('hidden',m!=='reg');
}
async function doLogin(){try{
  const u=document.getElementById('lgU').value.trim(),p=document.getElementById('lgP').value;
  if(!u||!p)return toast('Fill both fields',true);
  await api('/api/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
  toast('✅ Logged in');bootApp();
}catch(e){toast('❌ '+e.message,true)}}
async function doReg(){try{
  const u=document.getElementById('rgU').value.trim(),p=document.getElementById('rgP').value;
  if(!u||!p)return toast('Fill both fields',true);
  await api('/api/register',{method:'POST',body:JSON.stringify({username:u,password:p})});
  toast('✅ Created — login now');toggleAuth('login');
  document.getElementById('lgU').value=u;
}catch(e){toast('❌ '+e.message,true)}}
async function doLogout(){await api('/api/logout',{method:'POST'});location.reload();}

/* ---------- nav ---------- */
function go(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
  document.getElementById('p-'+p).classList.remove('hidden');
  document.querySelectorAll('.item').forEach(i=>i.classList.toggle('active',i.dataset.p===p));
  const titles={dashboard:'Dashboard',account:'Account',keys:'API Keys',stats:'Analytics',
    history:'Transactions',docs:'API Docs',logs:'Activity Logs',settings:'Settings',about:'About'};
  document.getElementById('title').textContent=titles[p]||p;
  document.getElementById('sidebar').classList.remove('open');
  if(p==='keys')loadKeys();
  if(p==='history')loadHistory();
  if(p==='logs')loadLogs();
  if(p==='stats')loadAnalytics();
  if(p==='settings')loadSettings();
}

/* ---------- boot ---------- */
async function bootApp(){
  try{
    const me=await api('/api/me');
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('shell').classList.remove('hidden');
    document.getElementById('chipUser').textContent=me.username;
    const dot=document.getElementById('emailDot');
    dot.className='dot '+(me.email_status==='online'?'on':me.email_status==='offline'?'off':'unk');
    fillAccount(me);
    loadDashboard();
  }catch(e){ console.error(e); location.reload(); }
}

function fillAccount(me){
  document.getElementById('acName').value=me.full_name||'';
  document.getElementById('acUpi').value=me.upi_id||'';
  document.getElementById('acMob').value=me.mobile||'';
  document.getElementById('acEmail').value=me.email||'';
  document.getElementById('acMin').value=me.default_qr_minutes||15;

  document.getElementById('emailTxt').textContent=me.email||'-';
  document.getElementById('upiTxt').textContent=me.upi_id||'-';
  document.getElementById('setStatus').textContent=me.email_status;
  document.getElementById('setLast').textContent=me.email_last_check||'-';
  document.getElementById('setMin').textContent=me.default_qr_minutes;
  document.getElementById('setUpi').textContent=me.upi_id||'-';
  document.getElementById('setEmail').textContent=me.email||'-';

  const checks=[
    {ok:!!me.full_name,t:'Full Name set'},
    {ok:!!me.upi_id,t:'UPI ID configured'},
    {ok:!!me.email,t:'Gmail connected'},
    {ok:me.has_app_password,t:'App Password saved'},
    {ok:me.email_status==='online',t:'Email verified online'}
  ];
  document.getElementById('setupList').innerHTML=checks.map(c=>
    `<li style="${c.ok?'':'opacity:.5'}">${c.t} ${c.ok?'✅':'⏳'}</li>`).join('');
}

/* ---------- dashboard ---------- */
async function loadDashboard(){try{
  const d=await api('/api/dashboard');
  document.getElementById('earn').textContent=d.total_earning.toFixed(2);
  document.getElementById('stKeys').textContent=d.total_api_keys;
  document.getElementById('stReq').textContent=d.total_requests;
  document.getElementById('stQR').textContent=d.total_qr_generated;

  const ch=document.getElementById('chart');
  const chartData = d.chart || []; // FIX: Fallback to empty array
  const max=Math.max(...chartData.map(x=>x.amount),1);
  
  if(chartData.length === 0){
    ch.innerHTML = '<div class="empty">No data</div>';
  } else {
    ch.innerHTML=chartData.map(x=>{
      const h=Math.max(4,(x.amount/max)*100);
      const day=new Date(x.day).toLocaleDateString('en',{weekday:'short'});
      return `<div class="bar-wrap"><div class="bar-val">₹${x.amount.toFixed(0)}</div>
        <div class="bar" style="height:${h}%"></div><div class="bar-label">${day}</div></div>`;
    }).join('');
  }
}catch(e){console.error(e); toast('❌ '+e.message,true)}}

/* ---------- account ---------- */
async function saveAccount(){try{
  const payload = {
    full_name:document.getElementById('acName').value.trim(),
    upi_id:document.getElementById('acUpi').value.trim(),
    mobile:document.getElementById('acMob').value.trim(),
    email:document.getElementById('acEmail').value.trim(),
    app_password:document.getElementById('acPass').value.trim(),
    default_qr_minutes:parseInt(document.getElementById('acMin').value)||15
  };
  if(!payload.upi_id) return toast('UPI ID required', true);
  if(!payload.email) return toast('Gmail required', true);

  await api('/api/setup-account',{method:'POST',body:JSON.stringify(payload)});
  toast('✅ Saved successfully!');document.getElementById('acPass').value='';bootApp();
}catch(e){toast('❌ '+e.message,true)}}

async function testEmail(){try{
  document.getElementById('testRes').innerHTML='<div style="color:var(--warning)">⏳ Testing…</div>';
  const d=await api('/api/test-email',{method:'POST',body:JSON.stringify({
    email:document.getElementById('acEmail').value,
    app_password:document.getElementById('acPass').value
  })});
  document.getElementById('testRes').innerHTML=`
    <div style="background:rgba(0,255,179,.1);border:1px solid rgba(0,255,179,.4);
      padding:12px;border-radius:10px;color:var(--neon-green);font-size:13px">
      ${d.message}<br>
      <b>Total emails:</b> ${d.total_emails || 0} &nbsp;|&nbsp; <b>Unseen:</b> ${d.unseen_emails || 0}
    </div>`;
  document.getElementById('emailDot').className='dot on';
}catch(e){
  document.getElementById('testRes').innerHTML=`
    <div style="background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.4);
      padding:12px;border-radius:10px;color:var(--danger);font-size:13px">
      ${e.message}
    </div>`;
  document.getElementById('emailDot').className='dot off';
}}

async function recheckEmail(){try{
  const d=await api('/api/test-email',{method:'POST',body:JSON.stringify({
    email:document.getElementById('acEmail').value,
    app_password:document.getElementById('acPass').value||' '
  })});
  document.getElementById('recheckRes').innerHTML=
    `<div style="color:var(--neon-green);font-size:13px">✅ ${d.message}</div>`;
}catch(e){
  document.getElementById('recheckRes').innerHTML=
    `<div style="color:var(--danger);font-size:13px">❌ ${e.message}</div>`;
}}

/* ---------- keys ---------- */
function toggleMode(){
  document.getElementById('daysWrap').style.display=
    document.getElementById('keyMode').value==='lifetime'?'none':'flex';
}
async function genKey(){try{
  const mode=document.getElementById('keyMode').value;
  const days=parseInt(document.getElementById('keyDays').value)||30;
  const d=await api('/api/generate-key',{method:'POST',body:JSON.stringify({
    mode, days, label:document.getElementById('keyLabel').value
  })});
  document.getElementById('keyRes').innerHTML=`
    <div style="background:rgba(0,255,179,.08);border:1px solid rgba(0,255,179,.4);
      padding:14px;border-radius:10px">
      <div style="color:var(--neon-green);font-weight:700;margin-bottom:6px">✅ Key Generated</div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:6px">Expiry: ${d.expiry}</div>
      <div class="api-out"><span>${d.example}</span>
        <button class="copy" onclick="copyText('${d.example}')">Copy</button></div>
    </div>`;
  loadKeys();loadDashboard();
}catch(e){toast('❌ '+e.message,true)}}

async function loadKeys(){try{
  const list=await api('/api/list-keys');
  const el=document.getElementById('keysList');
  if(!list || !list.length){el.innerHTML='<div class="empty"><div class="empty-ic">🔑</div>No keys yet</div>';return}
  el.innerHTML=list.map(k=>`
    <div class="txn" style="flex-direction:column;align-items:stretch;gap:8px;padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
        <div>
          <b style="font-size:13px">${k.api_key}</b>
          ${k.label?`<span style="color:var(--dim);font-size:11px;margin-left:6px">· ${k.label}</span>`:''}
          ${k.expiry==='LIFETIME'?'<span class="badge life" style="margin-left:6px">Lifetime</span>':''}
        </div>
        <button class="copy" style="background:rgba(255,71,87,.15);color:var(--danger);
          border:1px solid rgba(255,71,87,.3)" onclick="delKey('${k.api_key}')">Delete</button>
      </div>
      <div class="meta" style="font-size:11px;color:var(--dim)">
        Req: ${k.total_requests} · QR: ${k.total_qr} · Received: ₹${k.total_received} · Exp: ${k.expiry}
      </div>
      <div class="api-out"><span>${k.url}</span>
        <button class="copy" onclick="copyText('${k.url}')">Copy</button></div>
    </div>`).join('');
}catch(e){toast('❌ '+e.message,true)}}

async function delKey(k){
  if(!confirm('Delete this key?'))return;
  try{await api('/api/delete-key/'+k,{method:'DELETE'});toast('Deleted');loadKeys()}catch(e){toast('❌ '+e.message,true)}
}

/* ---------- history ---------- */
async function loadHistory(){try{
  const d=await api('/api/dashboard');
  const el=document.getElementById('txnList');
  const txns = d.transactions || [];
  if(!txns.length){el.innerHTML='<div class="empty"><div class="empty-ic">📜</div>No transactions yet</div>';return}
  el.innerHTML=txns.map(t=>`
    <div class="txn"><div>
      <div class="amt">+ ₹${t.amount.toFixed(2)}</div>
      <div class="meta">Txn: ${t.txn_id||'-'} · ${t.paid_at}</div>
    </div><div style="text-align:right;font-size:11px;color:var(--dim)">${t.order_id||''}</div></div>
  `).join('');
}catch(e){toast('❌ '+e.message,true)}}

/* ---------- quick QR ---------- */
async function quickQR(){try{
  const amt=parseFloat(document.getElementById('quickAmt').value)||100;
  const keys=await api('/api/list-keys');
  if(!keys || !keys.length)return toast('Generate an API key first',true);
  const url=keys[0].url+'&qr='+amt;
  document.getElementById('quickBox').innerHTML=`
    <div class="api-out"><span>${url}</span>
      <button class="copy" onclick="copyText('${url}')">Copy</button></div>
    <a href="${url}" target="_blank" class="btn sec" style="display:block;text-align:center;
      text-decoration:none;margin-top:8px;padding:11px">Open QR →</a>`;
}catch(e){toast('❌ '+e.message,true)}}

/* ---------- boot ---------- */
(async()=>{try{await api('/api/me');bootApp()}catch{}})();
</script>
